<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Limitaciones</title>
   
    <style>
        body { max-width: 800px; margin: 0 auto; padding: 20px; font-family: sans-serif; }
        form { border: 1px solid #ccc; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>Formulario con limitaciones</h1>

    <form action="destino.php" method="post">
        <!-- Envía a destino.php -->

        Ingresa tu nombre:
        <input type="text" name="nombre" disabled value="No se puede editar">
        <!-- disabled = campo BLOQUEADO -->
        <!-- Se ve pero no se puede escribir ni cambiar nada -->

        <br><br>

        Contraseña (máximo 5 caracteres):
        <input type="password" name="pass" maxlength="5">
        <!-- maxlength = límite de caracteres que se pueden escribir -->

        <br><br>

        Comentarios (solo lectura):
        <textarea name="comentarios" readonly>Este texto no se puede cambiar</textarea>
        <!-- readonly = solo lectura -->
        <!-- Se ve el texto pero no se puede modificar -->
        <!--Este dato si se envía -->

        <br><br>

        <input type="submit" value="enviar">
    </form>

</body>
</html>
