<!DOCTYPE html>
<!-- Declara que es un documento HTML5 -->
<html lang="es">
<!-- lang = idioma en español -->
<head>
    <meta charset="UTF-8">
    <!-- charset = reconoce caracteres especiales -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- viewport = ajusta para pantallas pequeñas -->
    <title>Formulario con Campos Ocultos</title>
    <!-- Título de la pestaña -->
    <!-- Nombre: Mayrim Kassandra Treviño Fierro -->
    <!-- Número de control: 1102 -->
    <!-- Grupo: 5J -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <!-- Enlace para usar iconos -->
    <style>
        body {
            max-width: 800px; /* no ocupa toda la pantalla */
            margin: 0 auto; /* centrado */
            padding: 20px; /* espacio interno */
            font-family: sans-serif; /* tipo de letra */
        }
        form {
            border: 1px solid #ccc; /* borde gris */
            padding: 15px; /* relleno */
            border-radius: 8px; /* redondeado */
        }
        button {
            padding: 8px 16px; /* tamaño del botón */
            margin: 5px; /* separación entre botones */
            cursor: pointer; /* cursor de mano */
        }
    </style>
</head>
<body>

    <h1>Formulario con campos ocultos</h1>
    <!-- Título principal -->

    <form action="" method="post">
        <!-- Abre el formulario -->

        <input type="hidden" name="hora" value="3:30">
        <!-- type="hidden" = CAMPO OCULTO -->
        <!-- NO se ve en la pantalla, el usuario no lo ve -->
        <!-- Se envía igual que los demás datos al enviar el formulario -->
        <!-- Sirve para mandar información que el usuario no necesita ver -->
        <!-- name="hora" = nombre del dato -->
        <!-- value="3:30" = el valor que se envía automáticamente -->

        Ingresa tu nombre:
        <input type="text" name="nombre">
        <!-- Campo visible para que el usuario escriba su nombre -->

        <br><br>

        <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i></button>
        <!-- Botón para enviar: manda el nombre Y la hora oculta juntos -->
        <button type="reset">Borrar <i class="fa fa-trash"></i></button>
        <!-- Borra solo lo visible, no afecta el campo oculto -->
    </form>

</body>
</html>
