    <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contraseña</title>
    
    <style>
        body { max-width: 800px; margin: 0 auto; padding: 20px; font-family: sans-serif; }
        form { border: 1px solid #ccc; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>Formulario para contraseñas</h1>

    <form action="destino.php" method="post">
        <!-- action = archivo que recibe los datos -->
        <!-- method="post" = método de envío -->

        Ingresa tu usuario:
        <input type="text" name="usuario">

        <br><br>

        Ingresa tu contraseña:
        <input type="password" name="pass">
        <!-- type="password" = oculta lo que se escribe con puntos -->
        <!-- Protege la contraseña de miradas ajenas -->

        <br><br>

        <input type="submit" value="enviar">
        <!-- Botón de envío -->

        <input type="reset" value="borrar">
        <!-- type="reset" = borra todo lo escrito y deja vacíos los campos -->
    </form>

</body>
</html>
