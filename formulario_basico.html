<!DOCTYPE html>
<html lang="es">
<!-- lang define el idioma de la página -->
<head>
    <meta charset="UTF-8">
    <!-- charset permite mostrar tildes, ñ y símbolos -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- viewport hace que se vea bien en celulares -->
    <title>Formulario Básico</title>
  
    <style>
        body { max-width: 800px; margin: 0 auto; padding: 20px; font-family: sans-serif; }
        form { border: 1px solid #ccc; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>Formulario Básico</h1>

    <form action="destino.php" method="post">
        <!-- form = crea el formulario -->
        <!-- action = archivo o dirección donde se envían los datos -->
        <!-- method="post" = forma de enviar la información de forma segura -->

        Ingresa tu nombre:
        <input type="text" name="nombre" size="20">
        <!-- type="text" = campo de texto normal -->
        <!-- name = nombre del campo para identificarlo al procesarlo -->
        <!-- size = ancho visible del campo -->

        <br><br>

        <input type="submit" value="enviar">
        <!-- type="submit" = botón que envía los datos -->
        <!-- value = texto que aparece en el botón -->
    </form>

</body>
</html>
