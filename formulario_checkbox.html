<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Casillas</title>
    
    <style>
        body { max-width: 800px; margin: 0 auto; padding: 20px; font-family: sans-serif; }
        form { border: 1px solid #ccc; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>Formulario con checkbox</h1>

    <form action="destino.php" method="post">
        <!-- Los datos se envían a destino.php -->

        Ingresa tu nombre:
        <input type="text" name="nombre">

        <br><br>

        Selecciona los lenguajes que conozcas:
        <br><br>

        <input type="checkbox" name="lenguaje" value="Java"> Java <br>
        <!-- type="checkbox" = casilla que se marca o desmarca -->
        <!-- Permite elegir varias opciones al mismo tiempo -->
        <!-- value = el valor que se envía cuando se marca esta opción -->

        <input type="checkbox" name="lenguaje" value="Python"> Python <br>
        <input type="checkbox" name="lenguaje" value="C#"> C# <br>
        <input type="checkbox" name="lenguaje" value="Flutter"> Flutter <br><br>

        <input type="submit" value="enviar">
    </form>

</body>
</html>
