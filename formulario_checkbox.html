<!DOCTYPE html>
<!-- Tipo de documento HTML5 -->
<html lang="es">
<!-- Idioma -->
<head>
    <meta charset="UTF-8">
    <!-- Codificación -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Ajuste de pantalla -->
    <title>Formulario con Casillas</title>
    <!-- Título en pestaña -->
    <!-- Nombre: Mayrim Kassandra Treviño Fierro -->
    <!-- Número de control: 1102 -->
    <!-- Grupo: 5J -->
    <style>
        body {
            max-width: 800px; /* no ocupa toda la pantalla */
            margin: 0 auto; /* centrado */
            padding: 20px; /* margen interno */
            font-family: sans-serif; /* tipo de letra */
        }
        form {
            border: 1px solid #ccc; /* línea alrededor */
            padding: 15px; /* espacio por dentro */
            border-radius: 8px; /* esquinas redondas */
        }
    </style>
</head>
<body>

    <h1>Formulario con checkbox</h1>
    <!-- Título principal -->

    <form action="" method="post">
        <!-- Abre el formulario -->

        Ingresa tu nombre:
        <input type="text" name="nombre">
        <!-- Campo para el nombre -->

        <br><br>

        Selecciona los lenguajes que conozcas:
        <br><br>

        <input type="checkbox" name="Java"> Java <br><br>
        <!-- type="checkbox" = casilla que se marca o desmarca -->
        <!-- SE PUEDE ELEGIR VARIAS A LA VEZ, no se desmarcan entre sí -->
        <!-- Cada casilla es independiente aunque se llamen igual -->

        <input type="checkbox" name="Python"> Python <br><br>
        <!-- Otra opción, se puede marcar junto con la anterior -->

        <input type="checkbox" name="Csharp"> C# <br><br>

        <input type="checkbox" name="Flutter"> Flutter <br><br>

        <input type="submit" value="enviar">
        <!-- Botón para enviar todo -->
    </form>

</body>
</html>
