<!DOCTYPE html>
<html lang="es">
<!-- Idioma -->
<head>
    <meta charset="UTF-8">
    <!-- Codificación -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Ajuste de pantalla -->
    <title>Formulario Agrupado</title>
    <!-- Título en pestaña -->
    
    <style>
        body {
            max-width: 800px; 
            margin: 0 auto; /* centrado */
            padding: 20px; /* margen interno */
            font-family: sans-serif; /* tipo de letra */
        }
        form {
            border: 1px solid #ccc; /* borde */
            padding: 15px; /* espacio interno */
            border-radius: 8px; /* redondeado */
        }
    </style>
</head>
<body>

    <h1>Formulario con agrupamiento</h1>
    <!-- Título -->

    <form action="" method="post">
        <!-- Formulario -->

        <fieldset>
            <!-- <fieldset> = dibuja un recuadro alrededor de varios campos -->
            <!-- Sirve para separar información por temas -->

            <legend>Datos personales</legend>
            <!-- <legend> = título que aparece DENTRO del borde del recuadro -->
           
            Nombre y apellido:
            <input type="text" name="nombre_apellido"><br><br>
            <!-- Campo de texto -->

            Fecha de nacimiento:
            <input type="date" name="fecha_nacimiento">
            <!-- type="date" = calendario para elegir la fecha -->
            <!-- No se escribe, se elige con clic -->
        </fieldset>
        <!-- Cierra recuadro -->

        <br>

        <fieldset>
            <!-- Segundo recuadro  -->
            <legend>Datos de estudio</legend>
            <!-- Título del segundo grupo -->

            Nombre de la escuela:
            <input type="text" name="escuela"><br><br>

            Fecha de egreso:
            <input type="date" name="fecha_egreso">
            <!-- Otro calendario -->
        </fieldset>

        <br>

        <input type="submit" value="enviar">
        <!-- Envía todos los campos de ambos recuadros -->
        <input type="reset" value="borrar">
        <!-- Limpia todo -->
    </form>

</body>
</html>
