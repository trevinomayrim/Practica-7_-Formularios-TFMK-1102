<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Agrupado</title>
  
    <style>
        body { max-width: 800px; margin: 0 auto; padding: 20px; font-family: sans-serif; }
        form { border: 1px solid #ccc; padding: 15px; border-radius: 8px; }
        fieldset { margin: 10px 0; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>

    <h1>Formulario con agrupamiento</h1>

    <form action="destino.php" method="post">
        <!-- Envía a destino.php -->

        <fieldset>
            <!-- fieldset = dibuja un recuadro alrededor de un grupo de campos -->
            <!-- Sirve para organizar la información por temas -->

            <legend>Datos personales</legend>
            <!-- legend = título que aparece adentro del borde del cuadro -->

            Nombre y apellido:
            <input type="text" name="nombre_completo"><br><br>

            Fecha de nacimiento:
            <input type="date" name="fecha_nacimiento">
            <!-- type="date" = muestra un calendario para elegir la fecha -->
        </fieldset>

        <fieldset>
            <!-- Segundo recuadro para información distinta -->
            <legend>Datos de estudio</legend>

            Nombre de la escuela:
            <input type="text" name="escuela"><br><br>

            Fecha de egreso:
            <input type="date" name="fecha_egreso">
        </fieldset>

        <br>

        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
    </form>

</body>
</html>
