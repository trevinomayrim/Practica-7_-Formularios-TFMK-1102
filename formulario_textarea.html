<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4. Formulario con Área de Texto</title>

    <style>
        body { max-width: 800px; margin: 0 auto; padding: 20px; font-family: sans-serif; }
        form { border: 1px solid #999; padding: 18px; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>4. Formulario con Área de Texto</h1>

    <form action="destino.php" method="post">

        Nombre:
        <input type="text" name="nombre">

        <br><br>

        Escribe tus comentarios:
        <br>
        <textarea name="comentarios" rows="5" cols="40"></textarea>
        <!-- <textarea> = recuadro grande para escribir varias líneas -->
        <!-- NO usa etiqueta de cierre en una sola línea como input -->
        <!-- rows="5" = cantidad de renglones visibles -->
        <!-- cols="40" = ancho en cantidad de letras -->

        <br><br>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpiar">
    </form>

</body>
</html>
