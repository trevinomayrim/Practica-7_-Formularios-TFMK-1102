<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Radioboton</title>
    <style>
        body { max-width: 800px; margin: 0 auto; padding: 20px; font-family: sans-serif; }
        form { border: 1px solid #ccc; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>Formulario con Radioboton</h1>

    <form action="destino.php" method="post">
        <!-- Archivo que recibe los datos -->

        Ingresa tu nombre:
        <input type="text" name="nombre">

        <br><br>

        Selecciona el máximo de estudios que tienes:
        <br><br>

        <input type="radio" name="estudios" value="ninguno"> Sin estudios <br>
        <!-- type="radio" = botón circular -->
        <!-- solo una opción -->
        <!-- TODOS MISMO name para que funcione -->
        <!-- value = dato que se envía al elegir la opción -->

        <input type="radio" name="estudios" value="primaria"> Primaria <br>
        <input type="radio" name="estudios" value="secundaria"> Secundaria <br>
        <input type="radio" name="estudios" value="preparatoria"> Preparatoria <br><br>

        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
    </form>

</body>
</html>
