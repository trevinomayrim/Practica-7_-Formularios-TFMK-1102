<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Lista</title>
    
    <style>
        body { max-width: 800px; margin: 0 auto; padding: 20px; font-family: sans-serif; }
        form { border: 1px solid #ccc; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>Formulario con lista de selección</h1>

    <form action="destino.php" method="post">
        <!-- Envía a destino.php -->

        Ingresa tu nombre:
        <input type="text" name="nombre">

        <br><br>

        Selecciona tu país:
        <select name="pais">
            <!-- select = crea una lista desplegable -->
            <!-- name = identifica qué opción se eligió -->

            <option value="argentina">Argentina</option>
            <!-- option = cada opción que aparece en la lista -->
            <!-- value = código que se envía al elegir esta opción -->

            <option value="espana">España</option>
            <option value="mexico">México</option>
            <option value="guatemala">Guatemala</option>
            <option value="honduras">Honduras</option>
            <option value="elsalvador">El Salvador</option>
            <option value="venezuela">Venezuela</option>
            <option value="colombia">Colombia</option>
        </select>
        <!-- Cierra la lista -->

        <br><br>

        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
    </form>

</body>
</html>
