<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Archivos</title>
   
    <style>
        body { max-width: 800px; margin: 0 auto; padding: 20px; font-family: sans-serif; }
        form { border: 1px solid #ccc; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>Formulario para subir archivos</h1>

    <form action="destino.php" method="post" enctype="multipart/form-data">
        <!-- enctype="multipart/form-data" = obligatorio para enviar archivos -->
        <!-- Permite que el formulario maneje documentos e imágenes -->

        Ingresa tu nombre:
        <input type="text" name="nombre">

        <br><br>

        Selecciona tu archivo:
        <input type="file" name="archivo">
        <!-- type="file" = abre ventana para elegir archivo de la computadora -->

        <br><br>

        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
    </form>

</body>
</html>
